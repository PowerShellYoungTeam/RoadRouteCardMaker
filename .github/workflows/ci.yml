name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-app:
    name: Web app (Jest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Workfolder/web-app-react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Workfolder/web-app-react/package-lock.json
      - run: npm ci
      - name: Jest
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true

  powershell:
    name: PowerShell module (Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester and ImportExcel
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module ImportExcel -Scope CurrentUser -Force
      - name: Pester
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Workfolder/powershell/tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $cfg
      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results
          path: pester-results.xml
